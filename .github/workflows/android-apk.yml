name: Build Android APK

# Produces an installable debug APK. Every branch build attaches it to the run
# as an artifact; a build of main also publishes it as a release asset.
# Run it from the Actions tab, or let it run on every push to a branch.
on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

# Needed to create the release below. Everything else here only reads.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: npm install

      - name: Generate the Android project
        # android/ is not committed — Capacitor regenerates it from www/ each build.
        run: |
          npx cap add android
          node tools/gen-icons.mjs --android
          npx cap sync android

      - name: Use the project's fixed signing key
        # Writing to ~/.android/debug.keystore is not enough: Gradle resolves
        # that path through ANDROID_USER_HOME, which the runner sets for itself,
        # so the copy is never found and the Android plugin generates a fresh
        # key anyway. The config is declared in the build file instead, where
        # the path is explicit and a missing keystore fails the build.
        run: node tools/patch-signing.mjs

      - name: Build the debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Verify the APK carries the expected signature
        # A silent signature change is the one failure that costs data, so it is
        # checked rather than assumed.
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          EXPECTED=$(keytool -list -v -keystore signing/nifo-debug.keystore \
            -storepass android 2>/dev/null | grep 'SHA256:' | head -1 | tr -d ' ')
          ACTUAL=$(keytool -printcert -jarfile "$APK" 2>/dev/null \
            | grep 'SHA256:' | head -1 | tr -d ' ')
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          test -n "$ACTUAL" && test "$EXPECTED" = "$ACTUAL"

      - name: Name the APK after the run
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/nifo-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: nifo-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish the APK as a release
        # An artifact is a zip, behind a GitHub login, that expires in 90 days.
        # A release asset is a plain .apk on a permanent URL, which is what you
        # want when the thing being downloaded goes straight onto a phone.
        # Only on main, so branch builds stay artifacts and do not litter the
        # releases page.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          APK="out/nifo-$SHORT.apk"
          # Re-running a build of the same commit must not fail on the tag it
          # created the first time round.
          if gh release view "build-$SHORT" >/dev/null 2>&1; then
            gh release upload "build-$SHORT" "$APK" --clobber
          else
            gh release create "build-$SHORT" "$APK" \
              --title "NiFo $SHORT" \
              --notes "Debug APK built from $GITHUB_SHA. Signed with the project's fixed key, so it installs over an earlier build without clearing your data." \
              --latest
          fi
